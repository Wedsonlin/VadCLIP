[project]
name = "vadclip"
version = "0.1.0"
description = "VadCLIP: Adapting Vision-Language Models for Weakly Supervised Video Anomaly Detection"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "opencv-python",
    "Pillow",
    "tqdm",
    "setuptools",
    "packaging>=23.0",
    "ftfy",
    "regex",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

# PyTorch CUDA 12.8 wheels (Blackwell sm_120 + Ampere sm_86). Other deps stay on PyPI.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
